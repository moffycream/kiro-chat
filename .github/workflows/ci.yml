name: Build

# Compiles, tests and packages on Windows. A push to main also publishes to the
# VS Code Marketplace, but only when package.json carries a version the
# Marketplace does not already have: it refuses a version twice, so an
# unbumped push builds and stops there. Publishing needs the VSCE_PAT secret.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run package

      # Download from the run's Artifacts tab to install a branch by hand.
      - uses: actions/upload-artifact@v4
        with:
          name: kiro-chat-vsix
          path: kiro-chat.vsix
          if-no-files-found: error

      - name: Publish to the Marketplace
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath kiro-chat.vsix --skip-duplicate
